<dialog
  #dialogEl
  (click)="onBackdropClick($event)"
  (close)="onDialogClose()"
  [class]="'sui-dialog ' + widthClass()"
>
  <form (ngSubmit)="onSubmit()">
    <div class="sui-dialog-header">
      <h2 class="sui-dialog-title">{{ title() }}</h2>
      <button type="button" (click)="close()" aria-label="Close" class="sui-dialog-close">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div class="sui-dialog-body">
      <ng-content />
    </div>

    <div class="sui-dialog-footer">
      <button type="button" (click)="close()" class="sui-btn sui-btn--ghost">
        {{ cancelLabel() }}
      </button>
      <button type="submit" [disabled]="busy()" class="sui-btn sui-btn--primary">
        {{ busy() ? 'Working…' : confirmLabel() }}
      </button>
    </div>
  </form>
</dialog>
