<div #hostEl class="relative">
  <input
    type="text"
    role="combobox"
    aria-controls="combobox-listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-activedescendant]="
      highlightedIndex() >= 0 ? 'combobox-option-' + highlightedIndex() : null
    "
    [value]="query()"
    (input)="onInput($any($event.target).value)"
    (focus)="onFocus()"
    (keydown)="onKeydown($event)"
    [placeholder]="placeholder()"
    class="sui-input"
  />

  @if (open()) {
    <ul
      id="combobox-listbox"
      role="listbox"
      class="sui-card scrollbar-subtle absolute z-10 mt-1 max-h-64 w-full overflow-y-auto rounded-lg py-1 shadow-lg"
    >
      @if (filtered().length === 0) {
        <li class="px-3 py-2 text-sm text-gray-500 dark:text-gray-400">No matches.</li>
      }
      @for (option of filtered(); track option.id; let i = $index) {
        <li
          role="option"
          [id]="'combobox-option-' + i"
          [attr.aria-selected]="i === highlightedIndex()"
          [attr.aria-disabled]="option.disabled || null"
          (click)="select(option)"
          [class]="i === highlightedIndex() ? 'bg-brand-50 dark:bg-white/10' : ''"
          class="flex items-center justify-between gap-2 px-3 py-2 text-sm hover:bg-gray-50 aria-disabled:cursor-not-allowed aria-disabled:opacity-50 dark:hover:bg-white/5"
        >
          <span class="font-medium text-slate-900 dark:text-white">{{ option.label }}</span>
          <span class="flex items-center gap-2">
            @if (option.badge) {
              <span
                class="rounded-full bg-brand-700 px-2 py-0.5 text-[10px] font-bold text-white dark:bg-brand-accent dark:text-brand-dark"
              >
                {{ option.badge }}
              </span>
            }
            @if (option.hint) {
              <span class="text-[11px] text-gray-400 dark:text-gray-500">{{ option.hint }}</span>
            }
          </span>
        </li>
      }
    </ul>
  }
</div>
