<div>
  <p class="text-xs font-semibold uppercase tracking-wide text-brand-700 dark:text-brand-accent">
    Admin
  </p>
  <h1 class="mt-1 text-2xl font-bold text-slate-900 dark:text-white">Analytics</h1>
  <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Usage across resources and people.</p>
</div>

<app-tab-bar
  class="mt-6 block"
  [tabs]="tabs"
  [(active)]="tab"
  variant="pill"
  ariaLabel="Analytics sections"
/>

@if (tab() === 'overview') {
  <section class="mt-8" aria-label="Overview">
    <div class="grid grid-cols-2 gap-3.5 lg:grid-cols-4">
      <app-stat-tile
        icon="clock"
        label="Total time"
        [value]="formatDuration(totalSeconds())"
        [sub]="'Last ' + range() + ' days'"
      />
      <app-stat-tile
        icon="bolt"
        label="Peak day"
        [value]="formatDuration(peakDay().value)"
        [sub]="peakDay().label"
      />
      <app-stat-tile
        icon="grid"
        label="Active resources"
        [value]="byResource().length"
        sub="all time"
      />
      <app-stat-tile icon="user" label="People" value="47" sub="with access" />
    </div>

    <div class="sui-card mt-6 px-5 py-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="font-bold text-slate-900 dark:text-white">Usage over time</h2>
          <p class="text-xs text-gray-500 dark:text-gray-400">Total minutes per day.</p>
        </div>
        <app-filter-chips [chips]="rangeChips" [(value)]="range" />
      </div>
      <div class="mt-4">
        <app-line-chart [points]="series()" [valueFormat]="formatDuration" />
      </div>
    </div>
  </section>
} @else {
  <section class="mt-8" aria-label="By resource">
    <h2 class="text-lg font-bold text-slate-900 dark:text-white">Resources by usage</h2>
    <p class="text-sm text-gray-500 dark:text-gray-400">Most-used first, all time.</p>
    <div class="mt-6">
      <app-bar-list [items]="byResource()" />
    </div>
  </section>
}
