<div>
  <p class="text-xs font-semibold uppercase tracking-wide text-brand-700 dark:text-brand-accent">
    Overview
  </p>
  <h1 class="mt-1.5 text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
    Welcome, {{ auth.currentUser()?.firstName }}
  </h1>
  <p class="mt-1.5 text-sm text-gray-400 dark:text-gray-500">Here's how the team looks today.</p>
</div>

<section class="mt-8" aria-labelledby="stats-heading">
  <h2 id="stats-heading" class="sr-only">Employee statistics</h2>

  @if (loading()) {
    <p class="text-sm text-gray-500 dark:text-gray-400">Loading…</p>
  } @else if (error(); as message) {
    <app-error-state [message]="message" [canRetry]="true" (retry)="reload()" />
  } @else {
    <div class="grid grid-cols-2 gap-3.5 lg:grid-cols-4">
      @for (tile of tiles(); track tile.label) {
        <app-stat-tile
          [icon]="tile.icon"
          [label]="tile.label"
          [value]="tile.value"
          [sub]="tile.sub"
        />
      }
    </div>
  }
</section>
